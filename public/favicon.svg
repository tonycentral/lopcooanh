<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges">
  <defs>
    <filter id="pixelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0" flood-color="#2D1708" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Retro Pixel Rounded Squircle Badge -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#F59E0B" />
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#FFF8E7" stroke="#3E200C" stroke-width="1.5" />
  
  <!-- Subtle warm ground shadow for chicken -->
  <ellipse cx="16" cy="26" rx="9" ry="2.5" fill="#E2D4BC" shape-rendering="auto" />

  <!-- 2. PIXEL ART CHICKEN (HARVEST TOWN / STARDEW STYLE) -->
  
  <!-- Red Comb (Mào Gà Đỏ) -->
  <rect x="13" y="5" width="2" height="3" fill="#D32F2F" />
  <rect x="15" y="4" width="3" height="4" fill="#E53935" />
  <rect x="18" y="5" width="2" height="3" fill="#EF5350" />
  <rect x="15" y="4" width="1" height="1" fill="#FFCDD2" /> <!-- highlight -->

  <!-- Chicken Head & Body Outline (Dark Charcoal/Brown Pixel Border) -->
  <!-- Tail Outline -->
  <rect x="6" y="11" width="2" height="3" fill="#2E180A" />
  <rect x="5" y="13" width="2" height="4" fill="#2E180A" />
  <rect x="7" y="10" width="3" height="2" fill="#2E180A" />
  <rect x="6" y="17" width="2" height="4" fill="#2E180A" />

  <!-- Head Outline -->
  <rect x="12" y="7" width="7" height="2" fill="#2E180A" />
  <rect x="19" y="8" width="2" height="4" fill="#2E180A" />
  <rect x="11" y="8" width="2" height="6" fill="#2E180A" />

  <!-- Beak & Wattle Outline -->
  <rect x="20" y="10" width="4" height="3" fill="#2E180A" />
  <rect x="19" y="13" width="2" height="3" fill="#2E180A" />

  <!-- Body Bottom Outline -->
  <rect x="8" y="21" width="13" height="2" fill="#2E180A" />

  <!-- Feet (Chân Gà) -->
  <rect x="11" y="23" width="2" height="3" fill="#E65100" />
  <rect x="10" y="25" width="4" height="1.5" fill="#FFA000" />
  <rect x="17" y="23" width="2" height="3" fill="#E65100" />
  <rect x="16" y="25" width="4" height="1.5" fill="#FFA000" />

  <!-- Main Body Fill (White & Cream Plump Feathers) -->
  <rect x="13" y="8" width="6" height="5" fill="#FFFFFF" />
  <rect x="8" y="12" width="12" height="9" fill="#FFFFFF" />
  <rect x="7" y="13" width="2" height="4" fill="#FFFFFF" />

  <!-- Feather Shadow / Depth (Cream & Warm Gray) -->
  <rect x="8" y="18" width="12" height="3" fill="#EFEBE9" />
  <rect x="9" y="20" width="11" height="1" fill="#D7CCC8" />
  <rect x="6" y="14" width="1" height="2" fill="#EFEBE9" />

  <!-- Wing (Cánh Gà) -->
  <rect x="10" y="14" width="6" height="4" fill="#FAFAFA" stroke="#D7CCC8" stroke-width="1" />
  <rect x="9" y="15" width="2" height="3" fill="#E0E0E0" />
  <rect x="12" y="16" width="3" height="1" fill="#BDBDBD" />

  <!-- Eye (Mắt Tròn Long Lanh) -->
  <rect x="16" y="9" width="2" height="2" fill="#212121" />
  <rect x="16" y="9" width="1" height="1" fill="#FFFFFF" /> <!-- eye gleam -->

  <!-- Cute Rosy Cheek (Má Hồng Dễ Thương) -->
  <rect x="14" y="11" width="2" height="1.5" fill="#FF8A80" opacity="0.8" />

  <!-- Yellow Beak Fill (Mỏ Vàng) -->
  <rect x="20" y="11" width="3" height="1.5" fill="#FFB300" />
  <rect x="20" y="12" width="2" height="1" fill="#FF8F00" />

  <!-- Red Wattle Fill (Yếm Đỏ) -->
  <rect x="18" y="13" width="2" height="2" fill="#E53935" />
  <rect x="18" y="14" width="1" height="1" fill="#C62828" />

  <!-- Little Sparkle (Lấp Lánh) -->
  <polygon points="26,5 27,7 29,7 27.5,8.5 28,10.5 26,9 24,10.5 24.5,8.5 23,7 25,7" fill="#FFD54F" />
</svg>
